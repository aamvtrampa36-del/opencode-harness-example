name: Metralla M08 integrated offline
on:
  push:
    branches: [metralla/integracion-01]
permissions:
  contents: read
concurrency:
  group: metralla-m08-integrated-offline
  cancel-in-progress: false
jobs:
  offline:
    if: github.repository == 'aamvtrampa36-del/opencode-harness-example' && github.ref == 'refs/heads/metralla/integracion-01' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact integrated source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 837dce9b283f6b4b0b2ba939407883ec95be726a HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Integrated Node specialist contracts
        env:
          TSC_BIN: ./node_modules/.bin/tsc
        run: |
          node --experimental-strip-types --test scripts/f0-c10/m08-github-collector.test.mjs scripts/f0-c10/m08-artifact-collector.test.mjs scripts/f0-c10/metralla-m02/*.test.mjs scripts/f0-c10/metralla-m03/*.test.mjs scripts/f0-c10/metralla-m04/*.test.mjs scripts/f0-c10/metralla-m05/*.test.cjs src/metralla-m06-*.test.mjs src/task-artifact-source.test.mjs src/task-output-artifacts.test.mjs src/task-artifact-http.test.mjs scripts/f0-c10/metralla-m07/*.test.mjs src/staging-control-mcp/p08-remote.test.mjs
      - name: Historical admission and release STOP contracts
        if: ${{ !cancelled() }}
        run: |
          node --experimental-strip-types --test scripts/f0-c10-r2-t04-fault.test.mjs scripts/f0-c10/c05-t03-server.test.mjs scripts/f0-c10/c05-t04-read-only.test.mjs scripts/f0-c10/c05-t09-safety.test.mjs scripts/f0-c10/inference-durable.test.mjs
          node --test scripts/f0-c10/r4-release-guard.test.mjs scripts/f0-c10/r4-promote.test.mjs scripts/f0-c10/r4-reconcile-plan.test.mjs scripts/f0-c10/evaluate.test.mjs scripts/f0-c10/live-evidence.test.mjs
      - name: Full Bun unit suite
        if: ${{ !cancelled() }}
        run: bun test
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck
      - name: Security invariants
        if: ${{ !cancelled() }}
        run: bun scripts/check-invariants.mjs
      - name: Offline evaluator matrix
        if: ${{ !cancelled() }}
        run: |
          node scripts/f0-c10/metralla-m07/run.mjs --suite > /tmp/m08-fixtures.json
          node scripts/f0-c10/run-offline.mjs --suite --out /tmp/m08-t10.json
          node -e "const x=require('/tmp/m08-t10.json');if(!x.pass||x.realStagingTested)process.exit(1)"
      - name: Build and static preview
        if: ${{ !cancelled() }}
        run: |
          bun run build
          bun scripts/test-preview.mjs
      - name: Two existing Staging Worker dry-run packages
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          rm -rf dist .wrangler/tmp
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.g1.jsonc bun run build
          M08_PACKAGE_INVENTORY_SLOT=a node scripts/f0-c10/pilot-staging-package.mjs | tee /tmp/m08-package-a.log
          rm -rf dist .wrangler/tmp
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.g1.jsonc bun run build
          M08_PACKAGE_INVENTORY_SLOT=b node scripts/f0-c10/pilot-staging-package.mjs | tee /tmp/m08-package-b.log
          node --input-type=module -e 'import {readFileSync} from "node:fs";const read=p=>{const l=readFileSync(p,"utf8").split("\n").filter(x=>x.startsWith("PILOT_STAGING_PACKAGE "));if(l.length!==1)throw Error("missing package receipt");return JSON.parse(l[0].slice("PILOT_STAGING_PACKAGE ".length));};const a=read("/tmp/m08-package-a.log"),b=read("/tmp/m08-package-b.log");const ia=JSON.parse(readFileSync("/tmp/m08-inventory-a.json")),ib=JSON.parse(readFileSync("/tmp/m08-inventory-b.json"));if(a.source!==process.env.GITHUB_SHA||b.source!==a.source||a.deployed!==false||b.deployed!==false)throw Error("M08_PACKAGE_IDENTITY_MISMATCH");for(const k of ["assets","build","principal","mcp"]){const am=new Map(ia[k]),bm=new Map(ib[k]);const diff=[...new Set([...am.keys(),...bm.keys()])].filter(p=>am.get(p)!==bm.get(p));console.log("M08_REBUILD_DIFF "+k+" "+JSON.stringify({count:diff.length,paths:diff.slice(0,40)}));if(am.size!==bm.size||diff.some(p=>!(["principal","mcp"].includes(k)&&p==="README.md"&&am.has(p)&&bm.has(p))))throw Error("M08_PACKAGE_REBUILD_MISMATCH");}const payload=x=>({...x,principal:{files:x.principal.files,deployable:x.principal.deployable},mcp:{files:x.mcp.files,deployable:x.mcp.deployable}});if(JSON.stringify(payload(a))!==JSON.stringify(payload(b)))throw Error("M08_DEPLOYABLE_REBUILD_MISMATCH");console.log("M08_DEPLOYABLE_REBUILD_MATCH "+JSON.stringify({payload:payload(a),rawA:a,rawB:b,excludedFromPayloadComparison:"Wrangler-generated top-level README.md only",fullArchiveByteIdentical:JSON.stringify(a)===JSON.stringify(b)}));'
      - name: Exact source and clean tracked files
        if: ${{ !cancelled() }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
