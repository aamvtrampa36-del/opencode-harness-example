name: CDF Dynamic Staging deployment readiness

on:
  workflow_dispatch:
  push:
    branches: [integration/dynamic-execution-20261118]
    paths:
      - .github/workflows/dynamic-staging-readiness.yml

permissions:
  contents: read

concurrency:
  group: cdf-dynamic-staging-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify existing credentials without revealing their values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -eu
          status=0
          for name in CLOUDFLARE_API_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::notice::No secrets were created, read or printed; deployment blocked until existing secrets are available."
            exit 1
          fi
          echo "Staging deployment and read-only authenticated smoke prerequisites: READY"
