name: Build Android test APK

on:
  pull_request:
    paths:
      - "examples/android-tareas/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "examples/android-tareas/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get app source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test and compile debug APK
        working-directory: examples/android-tareas
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK signature, manifest, and archive
        working-directory: examples/android-tareas
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -q "package: name='com.example.tareasnube'" apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Offline app must not request INTERNET permission"
            exit 1
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TareasNube-debug-apk
          path: examples/android-tareas/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: TareasNube-verification
          path: |
            examples/android-tareas/apk-metadata.txt
            examples/android-tareas/app/build/test-results/
          retention-days: 14
          if-no-files-found: warn
