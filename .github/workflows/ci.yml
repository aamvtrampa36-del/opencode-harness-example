name: OpenCode validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install
      - name: Unit tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Build both Worker and web client
        run: bun run build
      - name: Validate security and project invariants
        run: bun scripts/check-invariants.mjs
      - name: Run real local Worker HTTP and WebSocket smoke tests
        shell: bash
        run: |
          set -euo pipefail
          CI_LOCAL_SMOKE=1 bun run start --host 127.0.0.1 --port 8788 > /tmp/opencode-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/opencode-dev.log | tail -n 100' EXIT
          node scripts/smoke.mjs

