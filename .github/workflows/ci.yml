name: OpenCode validation

on:
  push:
    branches: [feat/staging-conversation-markdown-export-20261111, feat/staging-supervisor-control-20261111, feat/opencode-staging-base-20261112, feat/opencode-staging-mcp-final-20261118, staging/opencode-g1-20261118, fix/opencode-rpc-compatible-triage-20261120, staging/opencode-g1-rpc-safe-20261120, f0-c10/r3-t11-integration-20261123]
  pull_request:
    branches: [main, staging/opencode-g1-20261118, staging/opencode-g1-rpc-safe-20261120, f0-c10/t11-integration-20261122, f0-c10/r3-t01-oom-memory-20261123]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Test real static preview server
        run: bun scripts/test-preview.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Build both Worker and web client
        run: bun run build
      - name: Validate security and project invariants
        run: bun scripts/check-invariants.mjs
