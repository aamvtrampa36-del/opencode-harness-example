name: F0-C10 R2 T09 authenticated artifacts (offline)
on:
  push:
    branches: [f0-c10/r2-t09-authenticated-artifacts-20261122]
  pull_request:
    branches: [docs/f0-c10-t09-output-artifacts-20261122]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-c10-r2-t09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Artifact tests and response byte readback
        run: bun test src/task-output-artifacts.test.mjs src/staging-control-mcp/server.test.ts
      - name: Previous T09 independent loopback fixtures
        run: node --test docs/f0-c10/fixtures/09-output-contract.test.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Build Worker and client (no deploy)
        run: bun run build
      - name: Security invariants
        run: bun scripts/check-invariants.mjs
