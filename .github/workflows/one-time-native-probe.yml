name: One-time dependency lock and native OpenCode probe

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/one-time-native-probe.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Resolve pinned dependency graph
        run: |
          bun install
          test -s bun.lock
          echo "Direct dependencies pinned and transitive graph locked"
      - name: Upload reproducible lockfile
        uses: actions/upload-artifact@v4
        with:
          name: verified-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 2
      - name: Commit verified dependency lock to this same-repo PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "Lockfile already tracked; no write required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: track reproducible Bun dependency lock"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Verify native OpenCode CLI is separately runnable
        run: |
          set -euo pipefail
          timeout 100s bunx --bun opencode-ai --version
          echo "NATIVE_OPENCODE_CLI_OK"
      - name: Probe native headless OpenCode API
        run: |
          set -euo pipefail
          bunx --bun opencode-ai serve --hostname 127.0.0.1 --port 4097 > /tmp/opencode-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:4097/doc > /tmp/opencode-api-spec.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            tail -n 35 /tmp/opencode-server.log
            exit 1
          fi
          test -s /tmp/opencode-api-spec.json
          echo "NATIVE_OPENCODE_HTTP_API_OK"
