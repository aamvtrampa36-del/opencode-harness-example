name: OpenCode Staging mobile smoke

on:
  workflow_dispatch:
    inputs:
      send_live_message:
        description: "Enviar una tarea corta con el perfil económico (usa saldo OpenRouter)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: opencode-staging-mobile
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Check machine credentials are configured
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "Missing repository secret CF_ACCESS_CLIENT_ID"; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "Missing repository secret CF_ACCESS_CLIENT_SECRET"; exit 1; }

      - name: Verify Staging UI at 393 × 852
        run: bun run test:staging:mobile
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OPENCODE_STAGING_SEND_MESSAGE: ${{ inputs.send_live_message }}
