name: Metralla P26 exact C1 artifact export (offline)
on:
  push:
    branches: [metralla/m09-build]
permissions:
  contents: read
concurrency:
  group: metralla-m09-build
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'aamvtrampa36-del/opencode-harness-example' && github.ref == 'refs/heads/metralla/m09-build' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3a75b25b673ac30989a2cc21f1fe96deb667f47
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
          no-cache: true
      - name: Rebuild certified source only (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA=a3a75b25b673ac30989a2cc21f1fe96deb667f47
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = b506a0324c1eaafed647aee5273d64df477524d9
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bun install --frozen-lockfile
          rm -rf dist .wrangler/tmp
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.g1.jsonc bun run build
          M08_PACKAGE_INVENTORY_SLOT=b node scripts/f0-c10/pilot-staging-package.mjs | tee /tmp/m09-active.log
          M08_PACKAGE_INVENTORY_SLOT=b node scripts/f0-c10/m08-recovery-package.mjs
          git diff --exit-code
          git diff --cached --exit-code
      - name: Verify payload bytes and config before export
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readdirSync,readFileSync,writeFileSync,mkdirSync,cpSync,lstatSync} from 'node:fs';
          import {join,relative,dirname} from 'node:path';
          import {tmpdir} from 'node:os';
          import {createHash} from 'node:crypto';
          import ts from 'typescript';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const expect=(actual,want,label)=>{if(actual!==want)throw Error(label+' mismatch: '+actual);};
          const files=root=>readdirSync(root,{recursive:true,withFileTypes:true}).map(x=>{
            const p=join(x.parentPath??x.path,x.name);if(x.isSymbolicLink()||(!x.isDirectory()&&!x.isFile()))throw Error('unsafe entry '+p);return p;
          }).filter(p=>lstatSync(p).isFile()).sort();
          const tree=(root,excludeReadme=false)=>{const rows=files(root).map(p=>[relative(root,p),hash(readFileSync(p))]).filter(([p])=>!excludeReadme||p!=='README.md');return {rows,files:rows.length,sha256:hash(JSON.stringify(rows))};};
          const checkTree=(root,count,digest,exclude=false)=>{const x=tree(root,exclude);expect(x.files,count,root+' count');expect(x.sha256,digest,root);return x;};
          const normal=join(tmpdir(),'metralla-m08-repro');const recovery=join(tmpdir(),'m08-recovery-repro');
          const variants=[
            ['active-principal',join(normal,'principal'),230,'932a71c8045b8aae444bf7245d1f9345b9f527badb895b9faa1c114308027770'],
            ['active-mcp',join(normal,'mcp'),2,'8492fd574ad42c19f157a63c0bc13c83bbb7251738eecf88b7910ee4841e004a'],
            ['recovery-principal',join(recovery,'principal'),230,'932a71c8045b8aae444bf7245d1f9345b9f527badb895b9faa1c114308027770'],
            ['recovery-mcp',join(recovery,'mcp'),2,'62b94e192f2199122a39a95d6a83da6177f8389161b7b3ec659a5b4deaa3195f']
          ];
          const parse=p=>{const r=ts.parseConfigFileTextToJson(p,readFileSync(p,'utf8'));if(r.error)throw Error('config parse '+p);return r.config;};
          const configs=files('dist').filter(p=>p.endsWith('/wrangler.json')&&parse(p).name==='opencode-g1-staging');expect(configs.length,1,'principal config count');
          const specs=[['principal',configs[0],'482d0de2134f6ca9ca31a1197fc2f4835fc844b070b7a2f93caf27560f010e5f','f00c940fe173731d5caf94eca2d496af8797156d7566f852a555d44e461d3a5b','c3a0a8ce141238c30f67a1450ec6c1059ad4f09a36ad2564eb7254dd5c3ce48f'],['mcp','wrangler.mcp-staging.jsonc','31907fc438748600c198eaef9d85d204838f63e47a0134bc0dfe8f1559878e54','af4bb4a628421d9cd235bbadb21b0a2f49142e2969e71d13b68f822b21a5258b','ff3147fd580df8c05743ae0c27ebc73b9c4209151a6850ad372e03eee11d6dee']];
          const checks={};for(const [label,root,count,digest] of variants)checks[label]=checkTree(root,count,digest,true);
          checks.assets=checkTree('dist/client',308,'e787e30207b09cfd60bcef48ce67925dd534669b0781930dba089920d8ba3085');
          checks.build=checkTree('dist',540,'5018f80735649b1b3bd591b4b7347b78a74f77eec9a5d739bf739f4b10ba4c6a');
          const bindingKeys=['durable_objects','migrations','workflows','containers','r2_buckets','services','ai','worker_loaders'];
          const recoveryConfigs={};
          for(const [name,path,activeHash,recoveryHash,bindingHash] of specs){
            expect(hash(readFileSync(path)),activeHash,name+' config');const c=parse(path);
            expect(c.name,name==='principal'?'opencode-g1-staging':'opencode-staging-control-mcp','worker name');
            expect(hash(JSON.stringify(Object.fromEntries(bindingKeys.map(k=>[k,c[k]??null])))),bindingHash,name+' bindings');
            c.vars={...c.vars,OPENCODE_M08_RECOVERY_MODE:'true'};if(c.assets)c.assets.run_worker_first=true;
            const bytes=JSON.stringify(c);expect(hash(bytes),recoveryHash,name+' recovery config');recoveryConfigs[name]={path,bytes,activeHash,recoveryHash,bindingHash};
          }
          const receipt={schema:'metralla-p26-offline-export-v1',source:'a3a75b25b673ac30989a2cc21f1fe96deb667f47',tree:'b506a0324c1eaafed647aee5273d64df477524d9',originalCI:45576692735,artifactRun:process.env.GITHUB_RUN_ID,deployed:false,checks,configs:Object.fromEntries(Object.entries(recoveryConfigs).map(([k,v])=>[k,{path:v.path,activeHash:v.activeHash,recoveryHash:v.recoveryHash,bindingHash:v.bindingHash}]))};
          const out=join(tmpdir(),'p26-c1-export');mkdirSync(out,{recursive:false});
          for(const [label,root] of variants){const dest=join(out,'payloads',label);mkdirSync(dest,{recursive:true});for(const [p] of checks[label].rows){const target=join(dest,p);mkdirSync(dirname(target),{recursive:true});cpSync(join(root,p),target);}}
          cpSync('dist',join(out,'dist'),{recursive:true});
          cpSync('wrangler.mcp-staging.jsonc',join(out,'wrangler.mcp-staging.jsonc'));
          for(const [name,v] of Object.entries(recoveryConfigs))writeFileSync(join(out,dirname(v.path),'.m08-recovery-'+name+'.json'),v.bytes,{flag:'wx'});
          writeFileSync(join(out,'receipt.json'),JSON.stringify(receipt,null,2));
          console.log('P26_EXPORT_VERIFIED '+JSON.stringify({source:receipt.source,counts:variants.map(([k])=>[k,checks[k].files,checks[k].sha256]),deployed:false}));
          JS
      - name: Screen public export and bound its size before upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/p26-c1-export <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess, sys
          root = Path(sys.argv[1])
          if not root.is_dir() or root.is_symlink():
              raise SystemExit('P26_EXPORT_ROOT_INVALID')
          # Keep every original rule; no token-shaped value is allowlisted.
          patterns = [
              ('pem_header', rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----'),
              ('github_token', rb'\bgh[pousr]_[A-Za-z0-9]{36,}\b'),
              ('github_pat', rb'\bgithub_pat_[A-Za-z0-9_]{50,}\b'),
              ('sk_token', rb'\bsk-(?:proj-|or-v1-)?[A-Za-z0-9_-]{48,}\b'),
              ('aws_key', rb'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'),
              ('slack_token', rb'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
              ('google_key', rb'\bAIza[A-Za-z0-9_-]{35}\b'),
              ('jwt', rb'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{25,}\b'),
          ]
          # Prove a bare public PEM delimiter in a parsed JS/TS expression, not a
          # credential. A literal embedded in data, comments, templates or concatenations
          # cannot pass. Any other rule always blocks. Offsets are UTF-8 byte offsets.
          proof_js = r'''
          import fs from 'node:fs';
          import path from 'node:path';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          const require=createRequire(path.join(process.cwd(),'package.json'));
          const ts=require('typescript');
          const marker='-----BEGIN PRIVATE KEY-----';
          const generic=/^-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----$/;
          const file=process.argv[1];
          const bytes=fs.readFileSync(file), s=bytes.toString('utf8');
          const offsets=[];for(let i=s.indexOf('-----BEGIN ');i>=0;i=s.indexOf('-----BEGIN ',i+1)){const m=s.slice(i,i+80).match(/^-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----/);if(m)offsets.push(i);}
          const result={proofs:[],diagnostic:{parser:'typescript',version:ts.version,offsets:offsets.length,source:'unavailable',unresolved:[]}};
          const done=()=>console.log(JSON.stringify(result));
          if(!Buffer.from(s).equals(bytes)){result.diagnostic.error='invalid-utf8';done();process.exit(0);}
          function parse(name,text){return ts.createSourceFile(name,text,ts.ScriptTarget.Latest,true,ts.ScriptKind.JS);}
          function start(n,sf){return n.getStart(sf);}
          function nodesAt(sf,offset){const stack=[sf],out=[];while(stack.length){const n=stack.pop();if(n.pos>offset||n.end<=offset)continue;out.push(n);ts.forEachChild(n,c=>{stack.push(c);});}return out;}
          const sf=parse(file,s);
          result.diagnostic.parseErrors=sf.parseDiagnostics.length;
          if(sf.parseDiagnostics.length){result.diagnostic.error='parse-diagnostics';done();process.exit(0);}
          function role(n,sf,text){
           const p=n.parent; if(!p)return null;
           const raw=text.slice(start(n,sf),n.end);
           const literal=(ts.isStringLiteral(n)||ts.isNoSubstitutionTemplateLiteral(n))&&generic.test(n.text)&&['"',"'",'`'].includes(raw[0])&&raw.slice(1,-1)===n.text&&raw.at(-1)===raw[0];
           if(literal&&ts.isCallExpression(p)&&p.arguments[0]===n&&ts.isPropertyAccessExpression(p.expression)){
            const m=p.expression.name.text;
            if(['startsWith','endsWith','includes','indexOf','lastIndexOf'].includes(m)&&p.arguments.length===1)return {kind:'literal-parser-argument',method:m,offset:start(n,sf)+1};
            if(['replace','replaceAll'].includes(m)&&p.arguments.length===2&&ts.isStringLiteral(p.arguments[1])&&p.arguments[1].text==='')return {kind:'literal-strip-argument',method:m,offset:start(n,sf)+1};
           }
           if(n.kind===ts.SyntaxKind.RegularExpressionLiteral){const end=raw.lastIndexOf('/'),body=raw.slice(1,end),flags=raw.slice(end+1);if(raw[0]==='/'&&generic.test(body)&&/^[gimsuyd]*$/.test(flags)){
            if(ts.isCallExpression(p)&&p.arguments[0]===n&&ts.isPropertyAccessExpression(p.expression)&&['replace','replaceAll'].includes(p.expression.name.text)&&p.arguments.length===2&&ts.isStringLiteral(p.arguments[1])&&p.arguments[1].text==='')return {kind:'regex-strip-argument',method:p.expression.name.text,offset:start(n,sf)+1};
            if(ts.isPropertyAccessExpression(p)&&p.expression===n&&['test','exec'].includes(p.name.text)&&ts.isCallExpression(p.parent)&&p.parent.expression===p)return {kind:'regex-parser-receiver',method:p.name.text,offset:start(n,sf)+1};
           }}return null;
          }
          // Provenance: compare the installed, locked dependency with the public release,
          // then compare the exact marker, operation and guard AST (identifier renaming
          // is permitted, arbitrary literals or other expressions are not).
          let sourceGuards=[];
          const stringNode=n=>!!n&&(ts.isStringLiteral(n)||ts.isNoSubstitutionTemplateLiteral(n));
          function guard(n){
           const call=n.parent;if(!call||!ts.isCallExpression(call)||!ts.isPropertyAccessExpression(call.expression)||call.expression.name.text!=='indexOf'||call.arguments.length!==1||!ts.isIdentifier(call.expression.expression))return null;
           const cmp=call.parent;if(!cmp||!ts.isBinaryExpression(cmp)||cmp.left!==call||!ts.isNumericLiteral(cmp.right)||cmp.right.text!=='0'||![ts.SyntaxKind.ExclamationEqualsEqualsToken,ts.SyntaxKind.ExclamationEqualsToken].includes(cmp.operatorToken.kind))return null;
           const or=cmp.parent;if(!or||!ts.isBinaryExpression(or)||or.right!==cmp||or.operatorToken.kind!==ts.SyntaxKind.BarBarToken)return null;
           const l=or.left;if(!ts.isBinaryExpression(l)||!ts.isTypeOfExpression(l.left)||!ts.isIdentifier(l.left.expression)||l.left.expression.text!==call.expression.expression.text||!stringNode(l.right)||l.right.text!=='string'||![ts.SyntaxKind.ExclamationEqualsToken,ts.SyntaxKind.ExclamationEqualsEqualsToken].includes(l.operatorToken.kind))return null;
           const iff=or.parent;if(!iff||!ts.isIfStatement(iff)||iff.expression!==or)return null;
           let st=iff.thenStatement;if(ts.isBlock(st)&&st.statements.length===1)st=st.statements[0];
           if(!ts.isThrowStatement(st)||!st.expression||!ts.isNewExpression(st.expression)||!ts.isIdentifier(st.expression.expression)||st.expression.expression.text!=='TypeError'||st.expression.arguments?.length!==1||!stringNode(st.expression.arguments[0])||st.expression.arguments[0].text!=='"pkcs8" must be PKCS#8 formatted string')return null;
           return 'pkcs8-type-index-zero-throw';
          }
          try{
           const pkg=JSON.parse(fs.readFileSync('node_modules/jose/package.json','utf8'));
           const lock=fs.readFileSync('bun.lock','utf8');
           const src=fs.readFileSync('node_modules/jose/dist/webapi/key/import.js');
           const blob=createHash('sha1').update('blob '+src.length+'\0').update(src).digest('hex');
           const source=src.toString('utf8');
           if(pkg.version==='6.2.16'&&lock.includes('"jose": ["jose@6.2.16"')&&blob==='b171ae5dea7b8019e2d87b0d37fcdf3a104015b1'){
            const upstream=parse('import.js',source);const idx=source.indexOf(marker);
            if(!upstream.parseDiagnostics.length&&idx>=0){sourceGuards=nodesAt(upstream,idx).map(n=>({r:role(n,upstream,source),g:guard(n)})).filter(x=>x.r&&x.g).map(x=>x.g);}
            if(sourceGuards.length===1)result.diagnostic.source='jose-6.2.16-public-blob-verified';
           }else result.diagnostic.source='jose-lock-or-blob-mismatch';
          }catch{result.diagnostic.source='jose-source-unavailable';}
          for(const offset of offsets){
           const stack=nodesAt(sf,offset);let proof=null;
           for(const n of stack){
            const r=role(n,sf,s);if(!r||r.offset!==offset)continue;
            const g=guard(n);
            // Exact public guard proof required for the targeted jose-shaped marker.
            if(n.text===marker&&g&&sourceGuards.includes(g)){proof='jose-6.2.16-pinned-source-guard';break;}
            // Bare delimiter operations are already allowed by the previous guard.
            // Do not require guessed provenance: syntax is direct evidence of a marker,
            // not a key. For this target, report distinct AST proof and source status.
            if(n.text===marker&&r.method==='indexOf'&&sourceGuards.length===1){proof='jose-6.2.16-public-marker-operation-match';break;}
            if(!ts.isNoSubstitutionTemplateLiteral(n)){proof=r.kind;break;}
           }
           const byteOffset=Buffer.byteLength(s.slice(0,offset));
           if(proof)result.proofs.push([byteOffset,proof]);
           else result.diagnostic.unresolved.push({offset:byteOffset,ancestors:stack.slice(-7).map(n=>ts.SyntaxKind[n.kind]),literalExact:stack.some(n=>(ts.isStringLiteral(n)||ts.isNoSubstitutionTemplateLiteral(n))&&generic.test(n.text))});
          }
          done();
          '''
          blocked = {'.git','.env','.npmrc','.netrc','.dev.vars','credentials.json','secrets.json','id_rsa','id_ed25519'}
          total = count = findings = benign = unresolved = 0
          limit = 100 * 1024 * 1024
          for p in sorted(root.rglob('*')):
              rel = p.relative_to(root)
              if p.is_symlink() or any(x.lower() in blocked or x.lower().startswith(('.env.', '.dev.vars.')) or x.lower().endswith(('.pem','.p12','.pfx','.key')) for x in rel.parts):
                  raise SystemExit('P26_EXPORT_DISALLOWED_ENTRY')
              if p.is_dir():
                  continue
              if not p.is_file():
                  raise SystemExit('P26_EXPORT_NONREGULAR')
              if rel.parts[0] not in {'payloads','dist','wrangler.mcp-staging.jsonc','.m08-recovery-mcp.json','receipt.json'}:
                  raise SystemExit('P26_EXPORT_UNEXPECTED_TOPLEVEL')
              total += p.stat().st_size
              if total > limit:
                  raise SystemExit('P26_EXPORT_SIZE_LIMIT')
              data = p.read_bytes()
              evidence = {}
              if re.search(patterns[0][1], data) and p.suffix.lower() in {'.js','.mjs','.cjs','.ts','.tsx','.jsx'}:
                  try:
                      proc = subprocess.run(['node','--input-type=module','-e',proof_js,str(p)], capture_output=True, timeout=60, check=True)
                      parsed = json.loads(proc.stdout)
                      evidence = dict(parsed['proofs'])
                      print('P26_PEM_PROVENANCE '+json.dumps({'file_sha256':hashlib.sha256(data).hexdigest(),'diagnostic':parsed['diagnostic']},separators=(',',':')))
                  except (subprocess.SubprocessError, ValueError, OSError, KeyError, TypeError) as e:
                      print('P26_PEM_PROVENANCE '+json.dumps({'file_sha256':hashlib.sha256(data).hexdigest(),'error':type(e).__name__,'exit':getattr(e,'returncode',None)},separators=(',',':')))
                      # Unknown parser/format cannot be exempted.
              for rule, pattern in patterns:
                  for m in re.finditer(pattern, data):
                      proof = evidence.get(m.start()) if rule == 'pem_header' else None
                      findings += 1
                      if proof:
                          benign += 1
                      else:
                          unresolved += 1
                      if findings <= 100:
                          name = str(rel)
                          if not re.fullmatch(r'[A-Za-z0-9_./@+\-]+',name) or any(re.search(rx,name.encode()) for _,rx in patterns):
                              name = 'path-sha256:'+hashlib.sha256(name.encode()).hexdigest()
                          print('P26_EXPORT_FINDING '+json.dumps({'file':name,'file_sha256':hashlib.sha256(data).hexdigest(),'rule':rule,'offset':m.start(),'length':m.end()-m.start(),'proof':proof or 'UNRESOLVED'},separators=(',',':')))
              count += 1
          if not count:
              raise SystemExit('P26_EXPORT_EMPTY')
          print(f'P26_EXPORT_SCREEN_SUMMARY files={count} bytes={total} cap={limit} findings={findings} benign={benign} unresolved={unresolved}')
          if unresolved or findings > 100:
              raise SystemExit('P26_EXPORT_CREDENTIAL_PATTERN')
          print('P26_EXPORT_SCREEN_PASS; pattern screen only; all exceptions are parsed bare PEM delimiter operations')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metralla-p26-c1-exact-offline
          path: /tmp/p26-c1-export/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
