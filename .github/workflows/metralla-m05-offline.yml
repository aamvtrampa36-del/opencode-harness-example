name: Metralla M05 exact offline CI
on:
  push:
    branches: [metralla/m05]
permissions:
  contents: read
concurrency:
  group: metralla-m05-offline
  cancel-in-progress: false
jobs:
  offline:
    if: github.repository == 'aamvtrampa36-del/opencode-harness-example' && github.ref == 'refs/heads/metralla/m05' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - name: Frozen installation
        run: bun install --frozen-lockfile
      - name: M05 transport and raw-tree fixtures
        env:
          TSC_BIN: ./node_modules/.bin/tsc
        run: node --test scripts/f0-c10/metralla-m05/source.test.cjs scripts/f0-c10/metralla-m05/raw-tree.test.cjs
      - name: Relevant Bun regressions
        run: bun test src/metralla-m05-source.test.ts src/github.test.ts src/github-import.test.ts src/github-import-certification.test.ts src/github-import-source.test.ts src/project-scope.test.ts src/project-scope-read-only.test.ts src/github-publication-durable.test.ts
      - name: Full Bun unit suite
        run: bun test
      - name: Static preview
        run: bun scripts/test-preview.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Security invariants
        run: bun scripts/check-invariants.mjs
      - name: Confirm unchanged tracked sources
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
